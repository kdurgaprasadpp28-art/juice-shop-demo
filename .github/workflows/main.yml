name: CodeQL

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  schedule:
    - cron: "30 1 * * 0"   # Sun 01:30 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (JS/TS)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript', 'typescript' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional but recommended for JS/TS repos
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies (best-effort)
        run: |
          if [ -f package-lock.json ]; then npm ci; 
          elif [ -f package.json ]; then npm install; 
          fi

      # Initialize CodeQL with JS/TS and tighten the scope
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality
          paths: |
            .
          paths-ignore: |
            **/node_modules/**
            **/dist/**
            **/build/**
            **/coverage/**
            **/.next/**
            **/.turbo/**
            **/.cache/**

      # For JS/TS, a build is not strictly required; skip autobuild.
      # If your repo has a build step (e.g., Angular/TS), uncomment this:
      # - name: Build (if applicable)
      #   run: |
      #     if npm run | grep -q " build"; then npm run build; fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
